name: Forecast and Deploy

on:
  schedule:
    # 08:00 ICT (UTC+7), pre-market for HOSE.
    - cron: "0 8 * * *"
      timezone: Asia/Bangkok
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated HOSE tickers (overrides KRONOS_SYMBOLS for this run)"
        required: false
        default: ""
      n_inferences:
        description: "Inference passes per symbol (overrides KRONOS_N_INFERENCES)"
        required: false
        default: ""
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Source of truth: GitHub repo variable `KRONOS_SYMBOLS`
  # (Settings → Secrets and variables → Actions → Variables).
  # The literal fallback applies only when the repo variable is unset.
  KRONOS_SYMBOLS: ${{ vars.KRONOS_SYMBOLS || 'BMP,D2D,LPB,FPT,TCB' }}
  # Number of independent inference passes per symbol. Source of truth: repo
  # variable `KRONOS_N_INFERENCES`. Fallback default is 5.
  KRONOS_N_INFERENCES: ${{ vars.KRONOS_N_INFERENCES || '5' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --locked

      - name: Cache Kronos model weights
        uses: actions/cache@v4
        with:
          path: .kronos_model_cache
          # Bust the cache if the pin ever changes — update the version suffix manually.
          key: kronos-weights-v1-NeoQuasar-Tokenizer2k-mini

      - name: Run forecast
        env:
          KRONOS_MODEL_PATH: ./.kronos_model_cache
          KRONOS_SYMBOLS: ${{ inputs.symbols != '' && inputs.symbols || env.KRONOS_SYMBOLS }}
          KRONOS_N_INFERENCES: ${{ inputs.n_inferences != '' && inputs.n_inferences || env.KRONOS_N_INFERENCES }}
        run: uv run python update_predictions.py

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html style.css data.json prediction_chart_*.png _site/
          cp -r img _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
